<!DOCTYPE html>
<html lang="zh-Hant" data-time="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>穆席王朝｜世界觀</title>
<style>:root{
  --paper:#f4efe4; --paper2:#ece4d3; --ink:#2d2823; --red:#8f2a22; --gold:#a8834a; --muted:#6f655a;
  --serif:'Noto Serif TC','Songti TC','Noto Serif CJK TC',serif;
  /* 地圖色票（白天・設色） */
  --m-bg:#f4efe4; --m-ink:#3a2f27; --glow:rgba(214,160,60,.85);
  --g:#e9e0cb; --pl:#efe9dc; --gd:#e2e1c4; --rk1:#cbbfa8; --rk2:#efe6d4;
  --ms:#e3ddd0; --me:#d4cdbe; --mt:#f5f2eb;
  --ws:#b5493c; --we:#943a30;
  --rs:#e3b660; --re:#c79542; --rn:#d6a64f; --rw:#dcae58; --rt:#c99a4a;
  --hs:#a2a7a2; --he:#848a86; --hn:#939994; --hw:#9aa09b;
  --qs:#efe6d3; --qe:#dbcfb8;
  --gs:#ad4a3e; --ge:#8e3a31; --gt:#cdbb9c; --door:#3d2a24;
  --win:transparent;
  --t1:#7f9b74; --t2:#6d8a64; --t3:#93ab85; --mg:#eef0e8; --gk:#e6c45c; --bl:#ecbdb7; --wl:#bccb93;
  --wt:#aac4c1; --wood:#b48c5e; --herb:#a2a96c; --sand:#e8d9b4; --redf:#b5493c; --grn:#55805e; --bz:#7d7458;
  --quilt:#7393b3; --tent:#f0e6cf; --tent2:#d8c39a; --altar:#ece2c8; --stall:#c9574a; --rock:#bdb6a6; --cat:#2a2522; --lan:#d9503f;
  --d-osm:#df9f2c; --d-ginkgo:#d49d22; --d-blossom:#e3889a; --d-mag:#ffffff;
  --ml:#c9c6b2; --mr:#a9a893; --snow:#fbfaf6; --pad:#c9d39c; --grass:#d6dcaa; --north:#e2e2d6; --horse:#8a6a48;
  --rsD:#c48f3e; --reD:#a3742f; --wsD:#8f352b; --hsD:#868c88; --gL:#f4eedf; --shade:rgba(70,45,25,.16); --grain:.55;
}
/* 夜晚 */
html[data-time="night"]{
  --m-bg:#1e2331; --m-ink:#d9d0bb; --glow:rgba(255,206,110,.9);
  --g:#2f3544; --pl:#353b4a; --gd:#2f3a3a; --rk1:#2a2f3c; --rk2:#1e2331;
  --ms:#4a4f5c; --me:#3d424e; --mt:#575c69;
  --ws:#6b3a37; --we:#552e2c;
  --rs:#7b6744; --re:#64543a; --rn:#715f40; --rw:#766341; --rt:#6a5939;
  --hs:#4b505a; --he:#3f434c; --hn:#464b54; --hw:#4a4f58;
  --qs:#4a4a50; --qe:#3d3d44;
  --gs:#653836; --ge:#512d2c; --gt:#4f4a48; --door:#120f10;
  --win:rgba(255,196,92,.88);
  --t1:#36493f; --t2:#2f4038; --t3:#3c5045; --mg:#5d6466; --gk:#6e6234; --bl:#5f4851; --wl:#435040;
  --wt:#2b3d4d; --wood:#5a4a3a; --herb:#4b4f39; --sand:#4b4637; --redf:#7a3a35; --grn:#2f4a3a; --bz:#4a4538;
  --quilt:#3a4b60; --tent:#5d574b; --tent2:#4c4639; --altar:#5a5647; --stall:#6d3a35; --rock:#454a52; --cat:#0d0c0c; --lan:#ff7a4d;
  --d-osm:#8d6a2a; --d-ginkgo:#8a6c20; --d-blossom:#8a5862; --d-mag:#a9adb0;
  --ml:#3e4452; --mr:#323743; --snow:#8f96a3; --pad:#36433a; --grass:#334033; --north:#3a3f4b; --horse:#3e3227;
  --rsD:#5a4a31; --reD:#4a3e2b; --wsD:#4a2725; --hsD:#383c45; --gL:#383e4d; --shade:rgba(0,0,0,.25); --grain:.35;
}
/* 白描：只留墨線 */
.mapwrap[data-mode="line"]{
  --g:var(--m-bg); --pl:var(--m-bg); --gd:var(--m-bg); --rk1:var(--m-bg); --rk2:var(--m-bg);
  --ms:var(--m-bg); --me:var(--m-bg); --mt:var(--m-bg); --ws:var(--m-bg); --we:var(--m-bg);
  --rs:var(--m-bg); --re:var(--m-bg); --rn:var(--m-bg); --rw:var(--m-bg); --rt:var(--m-bg);
  --hs:var(--m-bg); --he:var(--m-bg); --hn:var(--m-bg); --hw:var(--m-bg); --qs:var(--m-bg); --qe:var(--m-bg);
  --gs:var(--m-bg); --ge:var(--m-bg); --gt:var(--m-bg); --door:var(--m-bg);
  --t1:var(--m-bg); --t2:var(--m-bg); --t3:var(--m-bg); --mg:var(--m-bg); --gk:var(--m-bg); --bl:var(--m-bg); --wl:var(--m-bg);
  --wt:var(--m-bg); --wood:var(--m-bg); --herb:var(--m-bg); --sand:var(--m-bg); --redf:var(--m-bg); --grn:var(--m-bg); --bz:var(--m-bg);
  --quilt:var(--m-bg); --tent:var(--m-bg); --tent2:var(--m-bg); --altar:var(--m-bg); --stall:var(--m-bg); --rock:var(--m-bg); --cat:var(--m-ink);
  --d-osm:transparent; --d-ginkgo:transparent; --d-blossom:transparent; --d-mag:transparent;
  --ml:var(--m-bg); --mr:var(--m-bg); --snow:var(--m-bg); --pad:var(--m-bg); --grass:var(--m-bg); --north:var(--m-bg); --horse:var(--m-bg);
  --rsD:var(--m-bg); --reD:var(--m-bg); --wsD:var(--m-bg); --hsD:var(--m-bg); --gL:var(--m-bg); --shade:transparent;
}
html[data-time="night"] .mapwrap[data-mode="line"]{ --win:rgba(255,196,92,.5); }

*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased}
body{line-height:1.75;overflow-x:hidden}
button{font-family:inherit;cursor:pointer}
a{color:inherit}

/* ---------- 首屏 ---------- */
.hero{min-height:100svh;display:grid;place-items:center;position:relative;overflow:hidden;padding:48px 20px}
.hero .bgsvg{position:absolute;inset:auto 0 0 0;width:100%;height:46%;opacity:.55;pointer-events:none}
.hero-inner{position:relative;display:flex;flex-direction:column;align-items:center;gap:30px}
.title-row{display:flex;flex-direction:row-reverse;align-items:flex-start;gap:22px}
.title{writing-mode:vertical-rl;font-size:clamp(54px,10vw,104px);font-weight:700;letter-spacing:.18em;margin:0;line-height:1}
.subtitle{writing-mode:vertical-rl;font-size:clamp(15px,2.2vw,19px);letter-spacing:.35em;color:var(--muted);margin-top:.6em}
.seal{background:var(--red);color:var(--paper);font-weight:700;border-radius:3px;display:inline-grid;place-items:center;line-height:1.05;text-align:center}
.title-row .seal{width:46px;height:46px;font-size:16px;align-self:flex-end;margin-bottom:6px}
.entries{display:flex;gap:18px}
.entry{border:1.5px solid var(--ink);background:transparent;padding:10px 28px;font-size:18px;letter-spacing:.4em;padding-right:calc(28px - .4em);position:relative;transition:.2s}
.entry::after{content:"";position:absolute;inset:3px;border:.5px solid var(--ink);pointer-events:none}
.entry:hover,.entry:focus-visible{background:var(--ink);color:var(--paper)}
.scrollhint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--muted);letter-spacing:.3em}

/* ---------- 區塊 ---------- */
section{padding:56px 20px}
.wrap{max-width:1180px;margin:0 auto}
.sec-title{display:flex;align-items:center;gap:12px;margin:0 0 22px;font-size:24px;letter-spacing:.25em}
.sec-title::before{content:"";width:10px;height:10px;background:var(--red);transform:rotate(45deg)}
.sec-title small{font-size:13px;letter-spacing:.1em;color:var(--muted);font-weight:400}

.today{max-width:620px;margin:0 auto;border:1px solid var(--ink);padding:22px 26px 18px;position:relative;background:var(--paper)}
.today::before{content:"";position:absolute;inset:4px;border:.5px solid rgba(45,40,35,.5);pointer-events:none}
.today h3{margin:0 0 6px;font-size:15px;letter-spacing:.3em;color:var(--red)}
.today p{margin:0 0 10px;font-size:17px}
.today .more{border:none;background:none;color:var(--muted);font-size:13px;padding:0;text-decoration:underline;text-underline-offset:3px}

/* ---------- 地圖 ---------- */
.maphead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:flex-start;gap:12px 22px;margin-bottom:10px}
.tabs{display:flex;gap:4px}
.tab{border:1px solid var(--ink);background:transparent;padding:6px 18px;font-size:17px;letter-spacing:.3em;padding-right:calc(18px - .3em)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.tab:disabled{opacity:.4;cursor:not-allowed}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--ink)}
.seg button{border:none;background:transparent;padding:4px 12px;font-size:14px;letter-spacing:.15em}
.seg button[aria-pressed="true"]{background:var(--red);color:var(--paper)}
.mapwrap{position:relative;height:min(76vh,780px);min-height:380px;background:var(--m-bg);border:1px solid var(--ink);overflow:hidden;touch-action:none;transition:background .5s}
.mapwrap::before{content:"";position:absolute;inset:5px;border:.5px solid var(--m-ink);opacity:.45;pointer-events:none;z-index:2}
.mapwrap svg{width:100%;height:100%;display:block;cursor:grab;user-select:none;-webkit-user-select:none}
.mapwrap svg.drag{cursor:grabbing}
.zoom{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:4px;z-index:3}
.zoom button{width:36px;height:36px;border:1px solid var(--m-ink);background:var(--m-bg);color:var(--m-ink);font-size:18px;line-height:1}
.maphint{position:absolute;left:14px;bottom:12px;font-size:12px;color:var(--m-ink);opacity:.6;z-index:3;letter-spacing:.1em}
.mapcorner{position:absolute;left:14px;top:12px;z-index:3;color:var(--m-ink);font-size:13px;letter-spacing:.3em;opacity:.8}

/* SVG 樣式 */
.world path,.world ellipse,.world line{stroke:var(--m-ink);stroke-linecap:round;stroke-linejoin:round}
.world .nf{fill:none}
.fp{fill:var(--m-bg)} .fg{fill:url(#g-g)} .fpl{fill:url(#g-pl)} .fgd{fill:var(--gd)} .frk{fill:url(#rockgrad)}
.fms{fill:var(--ms)} .fme{fill:var(--me)} .fmt{fill:var(--mt)} .fws{fill:url(#g-ws)} .fwe{fill:url(#g-we)}
.frs{fill:url(#g-rs)} .fre{fill:url(#g-re)} .frn{fill:url(#g-rn)} .frw{fill:url(#g-rw)} .frt{fill:var(--rt)}
.fhs{fill:url(#g-hs)} .fhe{fill:url(#g-he)} .fhn{fill:url(#g-hn)} .fhw{fill:url(#g-hw)} .fqs{fill:var(--qs)} .fqe{fill:var(--qe)}
.fgs{fill:var(--gs)} .fge{fill:var(--ge)} .fgt{fill:var(--gt)} .fdoor{fill:var(--door)}
.win{fill:var(--win);transition:fill .5s}
.ft1{fill:var(--t1)} .ft2{fill:var(--t2)} .ft3{fill:var(--t3)} .fmg{fill:var(--mg)} .fgk{fill:var(--gk)} .fbl{fill:var(--bl)} .fwl{fill:var(--wl)}
.fwt{fill:var(--wt)} .fwood{fill:var(--wood)} .fherb{fill:var(--herb)} .fsand{fill:var(--sand)} .fred{fill:var(--redf)} .fgrn{fill:var(--grn)} .fbz{fill:var(--bz)}
.fquilt{fill:var(--quilt)} .ftent{fill:var(--tent)} .ftent2{fill:var(--tent2)} .faltar{fill:var(--altar)} .fstall{fill:var(--stall)} .frock{fill:var(--rock)} .fcat{fill:var(--cat)}
.flan{fill:var(--lan)}
.fml{fill:var(--ml)} .fmr{fill:var(--mr)} .fsnow{fill:var(--snow)} .fpad{fill:var(--pad)} .fgrass{fill:var(--grass)} .fnorth{fill:var(--north)} .fhorse{fill:var(--horse)}
.world .dot-osm{stroke:var(--d-osm)} .world .dot-ginkgo{stroke:var(--d-ginkgo)} .world .dot-blossom{stroke:var(--d-blossom)} .world .dot-mag{stroke:var(--d-mag)}
html[data-time="night"] .lant .flan{filter:drop-shadow(0 0 6px #ff9a55)}
.loc{cursor:pointer;outline:none}
.loc path{transition:filter .25s}
.loc.hot,.loc:focus-visible{filter:drop-shadow(0 0 5px var(--glow)) drop-shadow(0 0 14px var(--glow))}
.loc.sel{filter:drop-shadow(0 0 4px var(--glow))}
.tag{pointer-events:none;transition:opacity .2s}
.tag rect{fill:var(--m-bg);stroke:var(--red);transition:fill .2s}
.tag rect.i{fill:none}
.tag.hot rect.i{stroke:var(--paper)}
.tag text{fill:var(--red);font-family:var(--serif);font-weight:700}
.tag{opacity:.85}
.tag.hot{opacity:1}
.tag.hot rect.o{fill:var(--red)} .tag.hot text{fill:var(--paper)}
html[data-time="night"] .tag rect.o{fill:#262b38} html[data-time="night"] .tag text{fill:#e9a28f} html[data-time="night"] .tag rect{stroke:#c46a55}
html[data-time="night"] .tag.hot rect.o{fill:#c46a55} html[data-time="night"] .tag.hot text{fill:#1e2331}

/* ---------- 卷軸面板 ---------- */
.scroll{position:fixed;top:0;right:0;height:100%;width:min(430px,100%);z-index:50;transform:translateX(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;filter:drop-shadow(-6px 0 18px rgba(0,0,0,.18))}
.scroll.open{transform:none}
.roller{height:20px;flex:none;background:linear-gradient(#5a3e2a,#3b281b 60%,#5a3e2a);border-radius:10px;margin:0 -6px;position:relative}
.roller::before,.roller::after{content:"";position:absolute;top:2px;width:14px;height:16px;border-radius:4px;background:#a8834a}
.roller::before{left:-4px}.roller::after{right:-4px}
.sheet{flex:1;overflow:auto;background:var(--paper);background-image:linear-gradient(90deg,rgba(168,131,74,.08),transparent 8%,transparent 92%,rgba(168,131,74,.08));padding:26px 26px 40px;border-left:1px solid #cdbf9f;border-right:1px solid #cdbf9f;overscroll-behavior:contain}
.close{position:absolute;top:28px;right:16px;border:1px solid var(--ink);background:var(--paper);width:34px;height:34px;font-size:18px;line-height:1;z-index:2}
.p-name{font-size:32px;margin:0;letter-spacing:.12em;line-height:1.3;padding-right:40px}
.p-sub{color:var(--red);font-size:14px;letter-spacing:.2em;margin:4px 0 16px}
.pic{margin:0 0 18px;position:relative;background:var(--paper2);border:1px solid #cdbf9f;aspect-ratio:4/3;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic .ph{display:none;position:absolute;inset:0;place-items:center;color:var(--muted);font-size:22px;letter-spacing:.4em;background:repeating-linear-gradient(45deg,transparent 0 12px,rgba(168,131,74,.07) 12px 13px)}
.pic.fail img{display:none}.pic.fail .ph{display:grid}
.p-sec{margin:20px 0 0}
.p-sec h4{margin:0 0 8px;font-size:14px;letter-spacing:.35em;color:var(--red);display:flex;align-items:center;gap:8px}
.p-sec h4::after{content:"";flex:1;height:.5px;background:#cdbf9f}
.p-sec p{margin:0 0 6px}
.people{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid #bfae8a;background:transparent;border-radius:999px;padding:2px 10px 2px 2px;font-size:14px}
.chip[aria-pressed="true"]{border-color:var(--red);background:rgba(143,42,34,.07)}
.av{width:28px;height:28px;border-radius:50%;overflow:hidden;background:var(--paper2);display:grid;place-items:center;font-size:12px;color:var(--red);border:1px solid #cdbf9f;flex:none;position:relative}
.av img{width:100%;height:100%;object-fit:cover;object-position:50% 14%;position:absolute;inset:0}
.who{margin-top:10px;font-size:15px;color:var(--muted);min-height:0}
.dn{display:grid;gap:6px}
.dn div{display:flex;gap:10px;opacity:.6;cursor:pointer}
.dn div.on{opacity:1}
.dn b{flex:none;cursor:pointer;background:transparent;font-family:inherit;color:inherit;padding:0;width:24px;height:24px;display:grid;place-items:center;border:1px solid var(--ink);font-size:13px;font-weight:400;margin-top:3px}
.dn div.on b{background:var(--ink);color:var(--paper)}
.exp-btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--ink);background:transparent;padding:6px 14px;font-size:15px;letter-spacing:.08em}
.btn:hover,.btn:focus-visible{background:var(--ink);color:var(--paper)}
.btn.red{border-color:var(--red);color:var(--red)} .btn.red:hover{background:var(--red);color:var(--paper)}
.result{margin-top:12px;border:1px solid #cdbf9f;background:rgba(255,255,255,.35);padding:14px 16px;font-size:16px;position:relative;animation:pop .35s ease}
.result:empty{display:none}
.result .meta{font-size:12px;color:var(--muted);letter-spacing:.2em;margin-bottom:4px}
.result .poem{font-size:18px;letter-spacing:.15em;line-height:2;margin:4px 0 8px}
.result .row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.result .meet{display:flex;gap:12px;align-items:flex-start}
.result .meet .av{width:52px;height:52px;font-size:18px}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.goto{margin-top:16px}

/* ---------- 人物譜 ---------- */
.roster{display:flex;align-items:flex-start;gap:14px;overflow-x:auto;padding:6px 2px 14px;scroll-snap-type:x mandatory}
.person{flex:none;width:112px;border:none;background:transparent;padding:0;text-align:center;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;color:inherit}
.person .ring{width:96px;height:96px;margin:0 auto 6px;border-radius:50%;padding:3px;border:1px solid var(--ink);transition:.2s}
.person .av{width:100%;height:100%;font-size:26px;border:none}
.person .nm{font-size:16px;letter-spacing:.1em}
.person .tt{font-size:12px;color:var(--muted);line-height:1.4}
.person[aria-pressed="true"] .ring{border-color:var(--red);box-shadow:0 0 0 2px var(--red)}
.pcard{border:1px solid var(--ink);padding:20px 22px;margin-top:6px;display:grid;grid-template-columns:auto 1fr;gap:18px;animation:pop .3s ease}
.pcard[hidden]{display:none}
.pcard .big{width:120px;height:160px;border:1px solid #cdbf9f;overflow:hidden;background:var(--paper2);position:relative;display:grid;place-items:center;font-size:40px;color:var(--red)}
.pcard .big img{width:100%;height:100%;object-fit:cover;object-position:50% 10%;position:absolute;inset:0}
.pcard h3{margin:0;font-size:24px;letter-spacing:.12em}
.pcard .t{color:var(--red);font-size:14px;letter-spacing:.15em}
.pcard .q{font-size:17px;margin:10px 0 6px;padding-left:12px;border-left:2px solid var(--red)}
.pcard .m{font-size:13px;color:var(--muted)}
.haunts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center;font-size:14px}

/* ---------- 頁尾 ---------- */
footer{padding:60px 20px 80px;text-align:center}
.plaque-wrap{display:inline-flex;flex-direction:column;align-items:center;text-decoration:none;color:var(--ink)}
.plaque-wrap .ropes{width:150px;height:34px}
.plaque{background:linear-gradient(#a3794b,#8a6239);border:2px solid #4b3220;border-radius:4px;padding:12px 26px;color:#f7ecd4;box-shadow:inset 0 0 0 3px #b98d5a,inset 0 0 0 4px #4b3220,0 6px 14px rgba(0,0,0,.15);transform-origin:50% -34px;transition:transform .3s}
.plaque-wrap:hover .plaque,.plaque-wrap:focus-visible .plaque{animation:sway 1.2s ease-in-out}
@keyframes sway{0%,100%{transform:rotate(0)}30%{transform:rotate(3deg)}65%{transform:rotate(-2deg)}}
.plaque b{display:block;font-size:22px;letter-spacing:.3em;padding-left:.3em}
.plaque small{font-size:11px;letter-spacing:.2em;opacity:.85}
.px{display:inline-block;width:18px;height:14px;vertical-align:-2px;margin-right:6px;image-rendering:pixelated;background:
 linear-gradient(#f2c14e,#f2c14e) 0 6px/18px 8px no-repeat,
 linear-gradient(#f2c14e,#f2c14e) 0 0/4px 6px no-repeat,
 linear-gradient(#f2c14e,#f2c14e) 7px 0/4px 6px no-repeat,
 linear-gradient(#f2c14e,#f2c14e) 14px 0/4px 6px no-repeat}
.footnote{margin-top:16px;color:var(--muted);font-size:15px;letter-spacing:.15em}
.colophon{margin-top:40px;font-size:12px;color:var(--muted);letter-spacing:.2em}

/* ---------- 手機 ---------- */
@media (max-width:720px){
  section{padding:40px 14px}
  .scroll{top:auto;bottom:0;height:80svh;width:100%;transform:translateY(105%);filter:drop-shadow(0 -6px 18px rgba(0,0,0,.2))}
  .scroll .roller{margin:0}
  .sheet{padding:20px 18px 36px}
  .close{top:26px}
  .mapwrap{height:66svh;min-height:340px}
  .maphead{align-items:stretch}
  .tab{padding:5px 12px;font-size:15px}
  .seg button{padding:4px 9px;font-size:13px}
  .pcard{grid-template-columns:1fr}
  .pcard .big{width:100px;height:130px}
  .p-name{font-size:28px}

/* 畫面特效 */
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.fx i{position:absolute;display:block}
.fx .snow{top:-12px;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 2px rgba(60,60,60,.25);animation:fall linear infinite}
.fx .petal{top:-12px;width:9px;height:5px;border-radius:70% 0 70% 0;background:#eeb1bc;animation:fall linear infinite}
.fx .petal.red{background:#d64a52;width:6px;height:6px;border-radius:50% 50% 50% 0}
.fx .sky{bottom:-24px;width:11px;height:14px;border-radius:45% 45% 30% 30%;background:radial-gradient(circle at 50% 40%,#ffe39a,#e46a2e);box-shadow:0 0 12px 4px rgba(255,170,80,.55);animation:rise linear infinite}
.fx .fw{width:110px;height:110px;border-radius:50%;opacity:0;background:repeating-conic-gradient(from 0deg,rgba(255,206,110,.95) 0 3deg,transparent 3deg 22deg);-webkit-mask:radial-gradient(circle,transparent 30%,#000 32%,#000 48%,transparent 50%);mask:radial-gradient(circle,transparent 30%,#000 32%,#000 48%,transparent 50%);animation:burst 3s ease-out infinite}
.fx .fw.r{background:repeating-conic-gradient(from 8deg,rgba(235,90,80,.95) 0 3deg,transparent 3deg 20deg)}
.fx .moon{top:34px;right:90px;width:74px;height:74px;border-radius:50%;background:radial-gradient(circle at 42% 40%,#fffbe8,#f0dc9c 70%);box-shadow:0 0 40px 14px rgba(255,236,170,.45)}
@keyframes fall{to{transform:translate(var(--dx,30px),900px) rotate(540deg)}}
@keyframes rise{0%{opacity:0}10%{opacity:1}85%{opacity:1}100%{transform:translate(var(--dx,20px),-900px);opacity:0}}
@keyframes burst{0%{transform:scale(.2);opacity:0}8%{opacity:1}60%{opacity:.9}100%{transform:scale(1.25);opacity:0}}
@media (max-width:720px){.fx .moon{right:30px;width:52px;height:52px}.feststrip{font-size:14px}}
.p-sec.fest-on p{background:rgba(143,42,34,.07);border-left:2px solid var(--red);padding:6px 10px}

   畫圖引擎：等角投影的墨線浮島。x 向東、y 向北、z 向上；北在右上。
   ============================================================ */
const Ink = (() => {
  const C30 = Math.cos(Math.PI / 6), K = 10, U = 1.37; // U：把「樣張像素」換成視圖單位
  let buf = [], R = null, bounds = null, OFF = [0, 0];

  function rng(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const g = () => (R() + R() + R() - 1.5) * 0.8;   // 近似常態
  const uni = (a, b) => a + (b - a) * R();

  function P(x, y, z = 0) {
    x += OFF[0]; y += OFF[1];
    const u = (x + y) * C30 * K, v = ((x - y) * 0.5 - z) * K;
    if (bounds) {
      if (u < bounds[0]) bounds[0] = u; if (u > bounds[2]) bounds[2] = u;
      if (v < bounds[1]) bounds[1] = v; if (v > bounds[3]) bounds[3] = v;
    }
    return [u, v];

    const res = [];
    for (let i = 0; i < pts.length - 1; i++) {
      const [x0, y0] = pts[i], [x1, y1] = pts[i + 1];
      const n = Math.max(1, Math.floor(Math.hypot(x1 - x0, y1 - y0) / seg));
      for (let k = 0; k < n; k++) {
        const t = k / n;
        res.push([x0 + (x1 - x0) * t + g() * amp, y0 + (y1 - y0) * t + g() * amp]);
      }
    }

    for (const k of [0.25, 0.5, 0.75]) { segs.push([I.P(x0, y0, z + h * k), I.P(x1, y0, z + h * k)]); segs.push([I.P(x1, y0, z + h * k), I.P(x1, y1, z + h * k)]); }

      pts.push(I.P(cx + hw, y0, z));

  function cylinder(x, y, z, r, h, cls) {

    const front = []; for (let i = iR; ; i = (i + 1) % N) { front.push(i); if (i === iL) break; }
    I.path(front.map(i => top[i]).concat(front.slice().reverse().map(i => bot[i])), { w: 1.2, cls: cls[0], close: true, amp: 0.3 });

  /* ======================= 宮城 ======================= */
  const palace = [

    { id: "chengming", depth: 0 + 17, label: [0, -17, 17], draw() {

    I.path(pts, { w: 1.2, cls: "fdoor" });

/* ============================================================
   介面：地圖、卷軸面板、人物譜、晝夜、網址定位
   ============================================================ */
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const store = {
    get(k, d) { try { const v = localStorage.getItem("muxi:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("muxi:" + k, JSON.stringify(v)); } catch (e) {} },
  };
  const MAPNAME = { palace: "宮城", city: "昭京", empire: "帝國" };

  /* ---------- 隨機、不連續重複 ---------- */
  const last = {};
  function pick(key, arr) {
    if (arr.length === 1) return arr[0];
    let i; do { i = Math.floor(Math.random() * arr.length); } while (i === last[key]);
    last[key] = i; return arr[i];
  }

  /* ---------- 頭像 ---------- */
  function avatar(id, cls = "av") {
    const c = DATA.chars[id];
    if (c) return `<span class="${cls}">${esc(c.name.slice(-1))}<img src="${c.avatar}" alt="" loading="lazy" onerror="this.remove()"></span>`;
    const n = DATA.npcs[id];
    return `<span class="${cls}">${esc(n ? n.name[0] : "？")}</span>`;
  }
  function pic(key, name) {
    if (!key) return "";
    return `<figure class="pic"><img src="${DATA.images[key]}" alt="${esc(name)}" loading="lazy" onerror="this.parentNode.classList.add('fail')"><span class="ph">${esc(name)}</span></figure>`;
  }

  /* ============ 地圖 ============ */
  const cache = {};
  const wrap = $("#mapwrap"), svg = $("#mapsvg");
  let cur = null, view = null, fit = null, anim = null, hotId = null, selId = null;

  function build(key) {
    if (cache[key]) return cache[key];
    const items = MAPS[key];
    const { body, bounds } = Ink.render(items, { palace: 7, city: 11, empire: 5 }[key]);
    const labels = {};
    for (const it of items) if (it.id) {
      const d = DATA[key][it.id], o = it.off || [0, 0]; const [u, v] = Ink.P(it.label[0] + o[0], it.label[1] + o[1], it.label[2]);
      labels[it.id] = { u, v, name: d.name.split("・")[0] };
      it.name = d.name;
    }
    const m = 60;
    const b = [bounds[0] - m, bounds[1] - m - 150, bounds[2] + m, bounds[3] + m];
    return (cache[key] = { body, bounds: b, labels });
  }
  function tagSVG(id, L) {
    const n = L.name.length, ch = 22, w = 30, h = n * ch + 14;
    let t = `<g class="tag" data-for="${id}" data-u="${L.u}" data-v="${L.v}"><g class="tg" transform="translate(${-w / 2},${-h})">`
      + `<rect class="o" width="${w}" height="${h}" stroke-width="1.3"/><rect class="i" x="3" y="3" width="${w - 6}" height="${h - 6}" stroke-width=".6"/>`;
    [...L.name].forEach((c, i) => { t += `<text x="${w / 2}" y="${27 + i * ch}" font-size="17" text-anchor="middle">${esc(c)}</text>`; });
    return t + "</g></g>";
  }
  function showMap(key, keepView) {

    pcard.innerHTML = `<div class="big">${esc(c.name.slice(-1))}<img src="${c.avatar}" alt="${esc(c.name)}" loading="lazy" onerror="this.remove()"></div>
      <div><h3>${esc(c.name)}</h3><div class="t">${esc(c.title)}・${esc(c.age)}</div>
      <p class="q">「${esc(c.quote)}」</p><p style="margin:0">${esc(c.intro)}</p><p class="m">${esc(c.look)}</p>
      <div class="haunts">常出沒：${c.haunts.map(([m, l]) => `<button class="btn" data-m="${m}" data-l="${l}">${esc(DATA[m][l].name)}<small style="color:var(--muted)">・${MAPNAME[m]}</small></button>`).join("")}</div></div>`;
    pcard.querySelectorAll("[data-m]").forEach(b => b.onclick = () => jump(b.dataset.m, b.dataset.l));
    if (scrollTo) $("#roster").scrollIntoView({ behavior: "smooth" });
  }
  roster.querySelectorAll(".person").forEach(p => p.onclick = () => {
    if (p.getAttribute("aria-pressed") === "true") { p.setAttribute("aria-pressed", "false"); pcard.hidden = true; return; }
    showChar(p.dataset.c);
  });
  function jump(map, id) {
    $("#maps").scrollIntoView({ behavior: "smooth" });
    setTimeout(() => openLoc(map, id), 350);
  }

  /* ============ 首屏、今日穆席 ============ */
  document.querySelectorAll("[data-enter]").forEach(b => b.onclick = () => { switchTab(b.dataset.enter); $("#maps").scrollIntoView({ behavior: "smooth" }); });
  const today = $("#today-text");
  const nextToday = () => { today.textContent = pick("today", DATA.today); };
  nextToday(); $("#today-more").onclick = nextToday;

  /* ============ 啟動 ============ */
  setTime(store.get("time", "day"));
  setMode(store.get("mode", "color"));
  setFest(store.get("fest", "none"));
  const m = location.hash.match(/^#(palace|city|empire)-(\w+)/);
  showMap(m ? m[1] : store.get("tab", "palace"));
  if (m) setTimeout(() => { $("#maps").scrollIntoView(); openLoc(m[1], m[2]); }, 50);
  window.addEventListener("hashchange", () => { const mm = location.hash.match(/^#(palace|city|empire)-(\w+)/); if (mm) openLoc(mm[1], mm[2]); });
})();

</script>
</body>
</html>
